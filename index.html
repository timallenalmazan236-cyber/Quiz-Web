<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    <title>One Piece Quiz</title>
</head>

<body>

<div class="quizcard"> 
<main>
    
    <!-- VIEW 1: INSTRUCTIONS -->
    <div id="instructions-section">
        <h2>QUIZ</h2>
        <hr>
        <div class="instructions">
            <div class="rule-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="#00aeff" viewBox="2 2 20 20">
                    <path d="M5 2H4v2h1v1c0 2.46 1.32 4.77 3.43 6.02.35.21.57.55.57.9v.16c0 .35-.21.69-.57.9A7.01 7.01 0 0 0 5 19v1H4v2h16v-2h-1v-1c0-2.46-1.32-4.77-3.43-6.02-.36-.21-.57-.55-.57-.9v-.16c0-.35.21-.69.57-.9A7.01 7.01 0 0 0 19 5V4h1V2zm12 3c0 1.76-.94 3.41-2.45 4.3-.97.57-1.55 1.55-1.55 2.62v.16c0 1.07.58 2.05 1.55 2.62 1.51.89 2.45 2.54 2.45 4.3v1H7v-1c0-1.76.94-3.41 2.45-4.3.97-.57 1.55-1.55 1.55-2.62v-.16c0-1.07-.58-2.05-1.55-2.62A5.01 5.01 0 0 1 7 5V4h10z"></path>
                </svg>
                <h3>30 Seconds</h3>
                <p>Each slide auto-advances after 30 seconds.</p>
            </div>

            <div class="rule-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="#00aeff" viewBox="2 2 20 20">
                    <path d="M22 12c0-4.09-2.47-7.61-6-9.16v2.24c2.39 1.39 4 3.96 4 6.92 0 1.85-.64 3.54-1.69 4.89l-1.42-1.42c.7-.98 1.12-2.17 1.12-3.47 0-1.77-.78-3.36-2-4.46v7.05l-2-2V4c0-.37-.2-.71-.53-.88-.32-.17-.72-.15-1.03.05L7.73 6.32 2.71 1.29 1.3 2.7l20 20 1.41-1.41-2.98-2.98A9.94 9.94 0 0 0 22 11.99Zm-10-1.41L9.17 7.76 12 5.87zm0 7.54-4.45-2.96s-.06-.02-.08-.03c-.06-.03-.12-.06-.19-.08s-.13-.03-.2-.04c-.03 0-.06-.02-.09-.02h-3V9h.76L3.02 7.27C2.41 7.61 2 8.26 2 9v6c0 1.1.9 2 2 2h2.7l5.75 3.83c.17.11.36.17.55.17.16 0 .32-.04.47-.12.33-.17.53-.51.53-.88v-1.76l-2-2z"></path>
                </svg>
                <h3>Silence</h3>
                <p>No talking while taking the quiz. Unnecessary noise leads to warnings.</p>
            </div>

            <div class="rule-box">
                <svg  xmlns="http://www.w3.org/2000/svg" width="36" height="36"  fill="#00aeff" viewBox="2 2 20 20" >
                    <path d="M18 6c0-2.21-1.79-4-4-4-.7 0-1.39.19-2 .55-.61-.35-1.3-.55-2-.55-2.21 0-4 1.79-4 4-2.21 0-4 1.79-4 4 0 .7.19 1.39.55 2-.35.61-.55 1.3-.55 2 0 2.21 1.79 4 4 4 0 2.21 1.79 4 4 4 .7 0 1.39-.19 2-.55.61.35 1.3.55 2 .55 2.21 0 4-1.79 4-4 2.21 0 4-1.79 4-4 0-.7-.19-1.39-.55-2 .35-.61.55-1.3.55-2 0-2.21-1.79-4-4-4m-8-2c.62 0 1.07.28 1.33.52l.67.6.67-.6c.26-.24.71-.52 1.33-.52 1.1 0 2 .9 2 2 0 .25-.05.5-.16.75L12 10.59 8.16 6.75C8.05 6.5 8 6.25 8 6c0-1.1.9-2 2-2M4 14c0-.62.28-1.07.52-1.33l.6-.67-.6-.67C4.28 11.07 4 10.62 4 10c0-1.1.9-2 2-2 .25 0 .5.05.75.16L10.59 12l-3.84 3.84C5.42 16.42 4 15.35 4 14m10 6c-.62 0-1.07-.28-1.33-.52l-.67-.6-.67.6c-.26.24-.71.52-1.33.52-1.1 0-2-.9-2-2 0-.25.05-.5.16-.75L12 13.41l3.84 3.84c.11.25.16.5.16.75 0 1.1-.9 2-2 2m5.48-7.33c.24.26.52.71.52 1.33 0 1.35-1.41 2.42-2.75 1.84L13.41 12l3.84-3.84C18.58 7.58 20 8.65 20 10c0 .62-.28 1.07-.52 1.33l-.6.67z"></path>
                </svg>
                    <path d="M18 6c0-2.21-1.79-4-4-4-.7 0-1.39.19-2 .55-.61-.35-1.3-.55-2-.55-2.21 0-4 1.79-4 4-2.21 0-4 1.79-4 4 0 .7.19 1.39.55 2-.35.61-.55 1.3-.55 2 0 2.21 1.79 4 4 4 0 2.21 1.79 4 4 4 .7 0 1.39-.19 2-.55.61.35 1.3.55 2 .55 2.21 0 4-1.79 4-4 0-.7-.19-1.39-.55-2 .35-.61.55-1.3.55-2 0-2.21-1.79-4-4-4m-8-2c.62 0 1.07.28 1.33.52l.67.6.67-.6c.26-.24.71-.52 1.33-.52 1.1 0 2 .9 2 2 0 .25-.05.5-.16.75L12 10.59 8.16 6.75C8.05 6.5 8 6.25 8 6c0-1.1.9-2 2-2M4 14c0-.62.28-1.07.52-1.33l.6-.67-.6-.67C4.28 11.07 4 10.62 4 10c0-1.1.9-2 2-2 .25 0 .5.05.75.16L10.59 12l-3.84 3.84C5.42 16.42 4 15.35 4 14m10 6c-.62 0-1.07-.28-1.33-.52l-.67-.6-.67.6c-.26.24-.71.52-1.33.52-1.1 0-2-.9-2-2 0-.25.05-.5.16-.75L12 13.41l3.84 3.84c.11.25.16.5.16.75 0 1.1-.9 2-2 2m5.48-7.33c.24.26.52.71.52 1.33 0 1.35-1.41 2.42-2.75 1.84L13.41 12l3.84-3.84C18.58 7.58 20 8.65 20 10c0 .62-.28 1.07-.52 1.33l-.6.67z"></path>
                </svg>
                <h3>Good Luck</h3>
                <p>Read and review carefully. Best of luck, Pirate!</p>
            </div>
        </div>

        <div class="stn-button">
            <button id="begin-btn">Click To Begin</button>
        </div>
    </div>

    <!-- VIEW 2: PRESENTATION SLIDE QUESTIONNAIRES -->
    <div id="quiz-section" class="questionaires hidden">
        <div class="quiz-header">
            <span id="question-tracker">01 / 10</span>
            <span id="question-timer">30s</span>
        </div>

        <!-- BLUE GRADIENT PROGRESS BAR -->
        <div class="progress-bar-track">
            <div id="blue-progress-fill" class="blue-progress-fill"></div>
        </div>
        <hr>
        
        <div class="slide-content">
            <h3 id="question-text" class="question-title">Question Title Goes Here</h3>
            
            <div id="options-container" class="options-container">
                <!-- Dynamically populated choices -->
            </div>
        </div>

        <!-- FOOTER NAVIGATION BUTTONS -->
        <div class="footer-navigation">
            <button id="prev-btn" class="nav-btn">&lt;</button>
            <button id="next-btn" class="nav-btn">&gt;</button>
        </div>
    </div>

    <!-- VIEW 3: SUMMARY & ANSWER KEY -->
    <div id="result-section" class="hidden">
        <h2>Quiz Summary & Answer Key</h2>
        <hr>
        <div id="summary-container" class="summary-container">
            <!-- Questions and correct answers rendered here -->
        </div>
        <div class="stn-button">
            <button id="restart-btn">Restart Quiz</button>
        </div>
    </div>

</main> 
</div>  

<script src="script.js"></script>
</body>
</html>
